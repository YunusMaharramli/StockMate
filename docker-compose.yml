services:
  postgres:
    image: postgres:17-alpine
    container_name: stockmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockmate
      POSTGRES_USER: stockmate
      POSTGRES_PASSWORD: ${STOCKMATE_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - stockmate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockmate -d stockmate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stockmate_postgres_data: