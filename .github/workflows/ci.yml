name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore StockMate.slnx
      - name: Build
        run: dotnet build StockMate.slnx --no-restore -c Release
      - name: Test
        run: dotnet test StockMate.slnx --no-build -c Release

  miniapp:
    name: Build Mini App (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StockMate.MiniApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: StockMate.MiniApp/package-lock.json
      - run: npm ci
      - run: npm run build
